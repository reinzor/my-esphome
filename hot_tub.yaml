<<: !include ./includes/secrets.yaml
<<: !include ./includes/common.yaml

esphome:
  name: hot_tub
  on_boot:
    then:
      - output.turn_on: led_status

esp32:
  board: esp32dev
  framework:
    type: esp-idf

i2c:
  sda: GPIO4
  scl:
    number: GPIO15
    ignore_strapping_warning: true

one_wire:
  - platform: gpio
    pin: GPIO32

output:
  - platform: gpio
    pin: GPIO25
    id: led_status

pcf8574:
  - id: inputs
    address: 0x22
  - id: outputs
    address: 0x24

switch:
  - platform: gpio
    id: relay_filter_pump
    name: "Filter pump"
    icon: mdi:pump
    pin:
      pcf8574: outputs
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: relay_blower
    name: "Blower"
    icon: mdi:chart-bubble
    pin:
      pcf8574: outputs
      number: 2
      mode: OUTPUT
      inverted: true
    on_turn_on:
      - delay: 3min
      - switch.turn_off: relay_blower
  - platform: gpio
    id: relay_flow_alarm
    name: "Flow alarm"
    icon: mdi:alarm-light
    pin:
      pcf8574: outputs
      number: 3
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "LED strips"
    icon: mdi:led-strip
    pin:
      pcf8574: outputs
      number: 4
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: relay_lights
    name: "Lights"
    icon: mdi:wall-sconce-round-variant
    pin:
      pcf8574: outputs
      number: 5
      mode: OUTPUT
      inverted: true

binary_sensor:
  - platform: gpio
    name: "Filter pump button"
    pin:
      pcf8574: inputs
      number: 0
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay_filter_pump
  - platform: gpio
    name: "Blower button"
    pin:
      pcf8574: inputs
      number: 1
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay_blower
  - platform: gpio
    name: "Lights button"
    pin:
      pcf8574: inputs
      number: 2
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay_lights
  - platform: gpio
    id: flow_switch
    name: "Flow switch"
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
  - platform: template
    id: no_flow_detected
    name: "No flow detected"
    lambda: |-
      return id(relay_filter_pump).state && !id(flow_switch).state;
    filters:
      # Single source of truth for the flow-alarm logic: only trigger the
      # alarm once "pump running AND no flow" has been true continuously
      # for 5s (a delayed *on*, so brief flow dips don't cause false alarms),
      # but clear the alarm immediately once flow is detected again.
      - delayed_on: 1s
    on_press:
      - switch.turn_on: relay_flow_alarm
    on_release:
      - switch.turn_off: relay_flow_alarm

sensor:
  - platform: dallas_temp
    name: "Temperature"
    update_interval: 30s
