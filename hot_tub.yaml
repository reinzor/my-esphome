<<: !include ./includes/secrets.yaml
<<: !include ./includes/common.yaml

esphome:
  name: hot_tub

esp32:
  board: esp32dev
  framework:
    type: esp-idf

i2c:
  sda: GPIO4
  scl:
    number: GPIO15
    ignore_strapping_warning: true

pcf8574:
  - id: inputs
    address: 0x22
  - id: outputs
    address: 0x24

switch:
  - platform: gpio
    id: relay_2
    name: "Filter pump"
    icon: mdi:pump
    pin:
      pcf8574: outputs
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: relay_3
    name: "Blower"
    icon: mdi:chart-bubble
    pin:
      pcf8574: outputs
      number: 2
      mode: OUTPUT
      inverted: true
    on_turn_on:
      - delay: 3min
      - switch.turn_off: relay_3
  - platform: gpio
    id: relay_4
    name: "Flow alarm"
    icon: mdi:alarm-light
    pin:
      pcf8574: outputs
      number: 3
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "LED strips"
    icon: mdi:led-strip
    pin:
      pcf8574: outputs
      number: 4
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Lights"
    icon: mdi:wall-sconce-round-variant
    pin:
      pcf8574: outputs
      number: 5
      mode: OUTPUT
      inverted: true
